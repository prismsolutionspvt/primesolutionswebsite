# Netlify build settings for the Prism Solutions site (Next.js 15 with Server Actions and middleware).
#
# The Next.js runtime plugin is declared explicitly so Netlify ALWAYS turns the build into a server-rendered site.
# Without it Netlify can publish the raw project folder as static files (every page then shows "Page not found").
# There is deliberately NO "publish" directory: the plugin sets it. Do not set one in the dashboard either.
# Secrets and addresses are NOT stored in this file: add them in Netlify under
# Site configuration -> Environment variables (names are listed in .env.example).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
